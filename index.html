<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Snapchat Dating</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background:#FFFC00; } /* Snapchat yellow */
  </style>

  <script>
    (function () {

      var FINAL_DEST = "https://m.snapchat.dating/";

      var url = new URL(window.location.href);
      var params = url.searchParams;
      var next = params.get("next") || FINAL_DEST;
      var promoted = params.get("promoted") === "1";

      // If we're inside an iframe (Forms.app embed), promote to top-level.
      if (!promoted && window.top !== window.self) {
        // Append promoted=1 so when we reload at top we don't loop.
        params.set("promoted", "1");
        try {
          // Keep ?next=... if present
          window.top.location.replace(url.toString());
        } catch (e) {
          // Fallback if access to top is blocked for some reason
          window.location.replace(url.toString());
        }
        return;
      }

      // We are top-level now. Go to final destination.
      // Use replace() so this helper page doesn’t remain in history.
      try {
        window.location.replace(next);
      } catch (e) {
        window.location.href = next;
      }
    })();
  </script>
</head>
<body></body>
</html>
